contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - busybox
    - ca-certificates-bundle
    - curl
    - glibc
    - wolfi-baselayout

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      shell: /sbin/nologin
  run-as: nonroot

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - arm64
