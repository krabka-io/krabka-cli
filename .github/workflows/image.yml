name: image

on:
  pull_request:
    paths:
      - .github/workflows/image.yml
      - .github/actions/free-disk-space/**
      - BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
      - Cargo.lock
      - Cargo.toml
      - bazel/**
      - crates/**
      - packaging/apko/**
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/krabka-io/krabka-cli

jobs:
  validate:
    if: github.event_name != 'push'
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/free-disk-space
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: build delivery image
        run: bazel build -c opt //packaging/apko:image_manifest_blob

  publish:
    if: github.event_name == 'push'
    name: build · publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/free-disk-space
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: image
          repository-cache: true
      - name: build delivery image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bazel build -c opt //packaging/apko:image_manifest_blob
      - name: build multi-platform release image
        if: startsWith(github.ref, 'refs/tags/')
        run: bazel build -c opt //packaging/apko:image_multiarch_index_blob
      - name: digest
        id: digest
        run: |
          target=image_manifest_blob
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target=image_multiarch_index_blob
          fi
          manifest="$(bazel cquery -c opt //packaging/apko:${target} --output=files)"
          echo "digest=sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish delivery image
        if: github.ref == 'refs/heads/main'
        run: bazel run -c opt //packaging/apko:push -- --tag "sha-${GITHUB_SHA::12}"
      - name: publish multi-platform release image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          current="${GITHUB_REF#refs/tags/}"
          newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          tags=("${current}" "sha-${GITHUB_SHA::12}")
          if [[ "${current}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${newest}" = "${current}" ]; then
            tags+=(latest)
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${tag}")
          done
          bazel run -c opt //packaging/apko:push_multiarch -- "${arguments[@]}"

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            test "${actual}" = "${EXPECTED_DIGEST}"
          done
      - name: attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
