name: docs-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the rustdoc set to GitHub Pages.
#
# The `docs` job in `ci.yml` renders the same set on every run and uploads it
# as an artifact nobody browses. This renders it once more from `main`, adds a
# landing page that lists every crate, and deploys it. The repository's Pages
# source must be set to "GitHub Actions" for the deployment to succeed.
#
# It is its own workflow rather than a job in `ci.yml` because a deployment
# needs `pages: write` and its own concurrency group, and because a failed
# deploy should not turn the merge gate red.

permissions:
  contents: read
  # Both the Pages deployment and setup-aspect's log uploads need the OIDC
  # token, as in `ci.yml`.
  id-token: write

# One deployment at a time. A push that lands while one is in flight waits
# rather than cancelling it, so the site never ends between two versions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Bootstrap the retained baseline on main before enabling composition validation.
    if: github.ref == 'refs/heads/main'
    name: render rustdoc
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The same query `ci.yml`'s docgen step runs, so the two never disagree
      # about which crates have documentation.
      - name: docgen
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/rustdoc-targets.txt"
          bazel query 'kind("rust_doc rule", //crates/...)' > "${targets}"
          test -s "${targets}"
          bazel build --target_pattern_file="${targets}"

      - name: assemble the site
        run: aspect rustdoc-site --output site --repo krabka-cli

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Packaging only: full-site link validation is a separate rollout once all
      # main-branch baseline archives exist. The standalone upload-rustdoc-pages
      # action also checks cross-site links, so it cannot bootstrap this baseline.
      - name: Checkout pinned packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krabka-io/tooling
          ref: de8015a2ae144099980c6a508ef57b6809f40dfb
          path: .docs-packaging
          sparse-checkout: actions/upload-rustdoc-pages

      - name: Stage public docs and linked hidden source pages
        run: |
          set -euo pipefail
          staging_root="$(mktemp -d "${RUNNER_TEMP}/rustdoc-pages.XXXXXX")"
          python3 .docs-packaging/actions/upload-rustdoc-pages/pages_site.py stage site "${staging_root}/site"
          echo "DOCS_STAGED_PATH=${staging_root}/site" >> "${GITHUB_ENV}"

      - name: Upload retained baseline archive
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DOCS_STAGED_PATH }}
          # Staging permits only linked hidden source pages, not checkout files.
          include-hidden-files: true
          retention-days: 90

      - name: Verify packaged files and Source links
        run: python3 .docs-packaging/actions/upload-rustdoc-pages/pages_site.py verify "${DOCS_STAGED_PATH}" "${RUNNER_TEMP}/artifact.tar"

  deploy:
    # workflow_dispatch can run from any ref; only main may publish to production Pages.
    if: github.ref == 'refs/heads/main'
    name: deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
