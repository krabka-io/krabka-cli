name: docs-pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the rustdoc set to GitHub Pages.
#
# The `docs` job in `ci.yml` renders the same set on every run and uploads it
# as an artifact nobody browses. This renders it once more from `main`, adds a
# landing page that lists every crate, and deploys it. The repository's Pages
# source must be set to "GitHub Actions" for the deployment to succeed.
#
# It is its own workflow rather than a job in `ci.yml` because a deployment
# needs `pages: write` and its own concurrency group, and because a failed
# deploy should not turn the merge gate red.

permissions:
  contents: read
  actions: read
  # Both the Pages deployment and setup-aspect's log uploads need the OIDC
  # token, as in `ci.yml`.
  id-token: write

# One deployment at a time. A push that lands while one is in flight waits
# rather than cancelling it, so the site never ends between two versions.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    # Validate PR archives without publishing; dispatch still builds only main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: render rustdoc
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The same query `ci.yml`'s docgen step runs, so the two never disagree
      # about which crates have documentation.
      - name: docgen
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/rustdoc-targets.txt"
          bazel query 'kind("rust_doc rule", //crates/...)' > "${targets}"
          test -s "${targets}"
          bazel build --target_pattern_file="${targets}"

      - name: assemble the site
        run: aspect rustdoc-site --output site --repo krabka-cli

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Checkout pinned site composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krabka-io/krabka-io.github.io
          ref: 38e80ab31b025645537a65a9d661634b90e37512
          path: .site-composition

      - name: Require a complete pinned site baseline
        run: |
          if ! node .site-composition/scripts/site-archives.mjs --check-lock .site-composition/docs/site-archives.lock.json; then
            echo '{"status":"failed","errors":["Complete reviewed site archive lock is missing or differs from the site catalog. Populate the baseline before rollout."]}' > "${RUNNER_TEMP}/composition-preflight.json"
            exit 1
          fi

      - name: Install archive-rendering browser
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium

      - name: Upload and validate API documentation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        uses: krabka-io/tooling/actions/upload-rustdoc-pages@2d2db15b48c940ab5ebb08bdd93d31bb637524fa # tooling PR #15
        with:
          path: site
          site-url: https://krabka.io/krabka-cli/
          composition-lock: .site-composition/docs/site-archives.lock.json
          component-id: cli

      - name: Save archive link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-link-report
          path: |
            ${{ steps.pages.outputs.link-report }}
            ${{ runner.temp }}/composition-preflight.json
          if-no-files-found: warn

  deploy:
    # workflow_dispatch can run from any ref; only main may publish to production Pages.
    if: github.ref == 'refs/heads/main'
    name: deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
