[package]
name = "krabka-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Operator CLI for Krabka (binary: `krabka`)"
repository = "https://github.com/krabka-io/krabka-cli"
homepage = "https://github.com/krabka-io/krabka-cli"
documentation = "https://docs.rs/krabka-cli"
readme = "README.md"
keywords = ["kafka", "cli", "operator", "krabka"]
categories = ["command-line-utilities"]

[lib]
name = "krabka_cli"
path = "src/lib.rs"

[[bin]]
name = "krabka"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["env"] }
gres-client-admin = { package = "krabka-client-admin", version = "0.4.2", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
gres-client-core = { package = "krabka-client-core", version = "0.4.2", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
gres-balancer = { package = "krabka-gres-balancer", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
gres-control = { package = "krabka-gres-control", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
gres-security = { package = "krabka-security", version = "0.4.2", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
gres-units = { package = "krabka-units", version = "0.4.2", git = "https://github.com/krabka-io/gres", rev = "5c0e1ab04f67de1d4d9d993d935e4eaa054284ed" }
krabka-client-admin = { version = "0.5.0" }
krabka-client-consumer = { version = "0.5.0" }
krabka-client-core = { version = "0.5.0" }
krabka-client-producer = { version = "0.5.0" }
krabka-format = { version = "0.7.0" }
# `KafkaUuid`, Kafka's base64url form of a cluster, topic or directory id.
krabka-ids = { version = "0.5.0" }
# The KIP-584 feature registry and the `metadata.version` table that
# `krabka features` and `krabka storage` read.
krabka-metadata = { version = "0.5.0" }
# `Record`, the envelope `krabka_metadata::from_kafka_record` decodes a
# bootstrap record from, for `krabka storage info`, and the topic id of the
# fetch that `console-consumer --partition` sends.
krabka-protocol = { version = "0.5.0" }
krabka-security = { workspace = true }
krabka-units = { workspace = true }
# `console-consumer --include`, the `headers.separator` of `console-producer`,
# and the topic patterns of `get-offsets` and `consumer-groups
# --validate-regex` are Java regular expressions.
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "process", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The type of the ids that krabka-client-admin reports, which `KafkaUuid`
# wraps.
uuid = { workspace = true }

# Forwards SIGTERM to a delegated plugin through a safe wrapper; the crate
# forbids `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
assert2 = { workspace = true }
# `mock` builds `MockBroker`, which tests/support/mod.rs wraps.
krabka-client-core = { version = "0.5.0", features = ["mock"] }
# The canned responses that the mock broker sends, and the errors that the
# tests match.
krabka-client-admin = { version = "0.5.0" }
krabka-protocol = { version = "0.5.0" }
krabka-units = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# tests/delegation.rs and tests/cancel.rs signal `krabka` and the plugin it
# runs.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
