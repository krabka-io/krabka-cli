[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
anyhow = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
# The admin UI's HTTP server. Default features off: it needs only HTTP/1 over
# tokio, plus the `json` and `query` extractors it names itself.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
# The admin UI's component framework. Pinned exactly: dioxus ships the macro,
# the renderer and the server integration as one version set, and a patch
# release of any of them against a different one of the others does not
# compile. `dioxus-ssr` renders a route to HTML on the server, which is the
# only renderer this UI uses.
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "html", "macro", "router", "server", "signals"] }
dioxus-ssr = "=0.7.10"
# `#[cfg_attr(test, mutants::skip)]` for cargo-mutants, where a mutant cannot
# be killed by a test rather than merely not being killed yet. Dev-dependency
# only; it expands to nothing.
mutants = "0.0.4"
parking_lot = "0.12"
# Drives a real browser for the admin UI's `e2e` suite. Optional, behind that
# feature: the tests need installed Playwright browsers and a running UI.
playwright-rs = "0.15.0"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde-wincode = "=0.1.2"
serde_json = "1"
# Decodes the `application/x-www-form-urlencoded` bodies that the admin UI's
# rendered mutation forms post. axum already carries this crate for its own
# `Form` extractor; the admin UI names it because it reads the CSRF field out
# of the body before it deserialises the request.
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Keep these paired so `SerdeCompat` implements this wincode's traits.
wincode = "=0.6"

# First-party crates inherited by more than one member.
krabka-security = "0.4.0"
krabka-units = "0.4.0"

# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every crate each sibling publishes is listed, not only the ones this
# repo names directly: cargo ignores a dependency's own patch table, so a
# crate reached transitively would otherwise come from the registry while
# its git twin is also in the graph.
[patch.crates-io]
krabka-audit = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-authz = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-broker = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-format = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-log = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-logfmt = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-object-store = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-raft = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-records-legacy = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-remote-storage = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-remote-storage-topic = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-telemetry = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-throttle = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
# `krabka-broker` depends on `krabka-schema-serde`, so the git dependency
# above needs it patched here too. Resolved from krabka-schema-registry, the
# same source the broker itself patches, so the broker gets the copy it was
# built against.
krabka-schema-serde = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "ee9c3933fb1d71735846e7e5e33ea6ab3a694dc5" }
krabka-client-admin = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "9ff0e35efe65af4e20e4cfaeaee8edd4688edb50" }
krabka-client-consumer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "9ff0e35efe65af4e20e4cfaeaee8edd4688edb50" }
krabka-client-core = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "9ff0e35efe65af4e20e4cfaeaee8edd4688edb50" }
krabka-client-producer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "9ff0e35efe65af4e20e4cfaeaee8edd4688edb50" }
krabka-compression = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-kafka-tap = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-trace-context = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-units = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-voters = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
