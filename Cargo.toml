[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
anyhow = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
# The admin UI's HTTP server. Default features off: it needs only HTTP/1 over
# tokio, plus the `json` and `query` extractors it names itself.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
# The admin UI's component framework. Pinned exactly: dioxus ships the macro,
# the renderer and the server integration as one version set, and a patch
# release of any of them against a different one of the others does not
# compile. `dioxus-ssr` renders a route to HTML on the server, which is the
# only renderer this UI uses.
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "html", "macro", "router", "server", "signals"] }
dioxus-ssr = "=0.7.10"
# `#[cfg_attr(test, mutants::skip)]` for cargo-mutants, where a mutant cannot
# be killed by a test rather than merely not being killed yet. Dev-dependency
# only; it expands to nothing.
mutants = "0.0.4"
parking_lot = "0.12"
# Drives a real browser for the admin UI's `e2e` suite. Optional, behind that
# feature: the tests need installed Playwright browsers and a running UI.
playwright-rs = "0.19.0"
# Sends a signal to a child process without `unsafe`.
rustix = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes the `application/x-www-form-urlencoded` bodies that the admin UI's
# rendered mutation forms post. axum already carries this crate for its own
# `Form` extractor; the admin UI names it because it reads the CSRF field out
# of the body before it deserialises the request.
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
# `CancellationToken`, which ties Ctrl-C to a running command.
tokio-util = { version = "0.7", default-features = false }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# First-party crates inherited by more than one member.
krabka-security = "0.5.0"
krabka-units = "0.5.0"

# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every crate each sibling publishes is listed, not only the ones this
# repo names directly: cargo ignores a dependency's own patch table, so a
# crate reached transitively would otherwise come from the registry while
# its git twin is also in the graph.
[patch.crates-io]
# `krabka-broker` depends on `krabka-schema-serde`, so the git dependency
# above needs it patched here too. Resolved from krabka-schema-registry, the
# same source the broker itself patches, so the broker gets the copy it was
# built against.
krabka-admin-ui = { path = "crates/admin-ui" }
krabka-app-sdk = { git = "https://github.com/krabka-io/krabka-gateway", rev = "49870fd8e5f708274ff69a3e64a092844e2f8809" }
